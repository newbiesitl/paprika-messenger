name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Service and packaging tests
        run: npm test
      - name: Build hosted Worker
        run: npm run build
      - name: Verify GitHub install package matches source
        run: node scripts/prepare-github-plugin.mjs --check
      - name: Automated receiver pilot tests
        run: node --test experiments/local/codex-event-receiver/receiver.test.mjs experiments/local/codex-event-receiver/session-context.test.mjs
      - name: Native delivery probe tests
        run: node --test experiments/native-delivery/probe.test.mjs experiments/native-delivery/chatgpt-bridge.test.mjs
      - name: Verify all release checksums and archive contents
        run: node scripts/release.mjs verify

  validate-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Service and packaging tests on macOS
        run: npm test
      - name: Build hosted Worker on macOS
        run: npm run build
      - name: Verify GitHub install package matches source
        run: node scripts/prepare-github-plugin.mjs --check
      - name: Native delivery probe tests on macOS
        run: node --test experiments/native-delivery/probe.test.mjs experiments/native-delivery/chatgpt-bridge.test.mjs
      - name: Verify all release checksums and Mac archive extraction
        run: node scripts/release.mjs verify
