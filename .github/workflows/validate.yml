name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Service and packaging tests
        run: npm test
      - name: Build hosted Worker
        run: npm run build
      - name: Verify GitHub install package matches source
        run: node scripts/prepare-github-plugin.mjs --check
      - name: Automated receiver pilot tests
        run: node --test experiments/local/codex-event-receiver/receiver.test.mjs experiments/local/codex-event-receiver/session-context.test.mjs
      - name: Verify bundled release checksum
        run: node -e "const fs=require('node:fs'),crypto=require('node:crypto');const dir='releases/1.3.4/';const [expected,file]=fs.readFileSync(dir+'SHA256SUMS','utf8').trim().split(/\s+/);const actual=crypto.createHash('sha256').update(fs.readFileSync(dir+file)).digest('hex');if(actual!==expected)throw Error('Release checksum mismatch');console.log('Release checksum verified')"
